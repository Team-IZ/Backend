[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# startCommand를 생략하면 서비스에 저장된 옛 값(build/libs/backend-0.0.1-SNAPSHOT.jar)으로
# 폴백해 컨테이너가 즉시 죽습니다. Dockerfile ENTRYPOINT와 동일한 명령을 명시해 항상 덮어씁니다.
# 이미지 안에는 WORKDIR /app 기준 app.jar만 존재합니다.
#
# -Dserver.port는 넣지 않습니다. Dockerfile ENTRYPOINT는 App Runner용으로 8080을 고정하지만,
# Railway는 포트를 PORT 환경변수로 주입하므로 application.yaml의 ${PORT:8080}이 처리하게 둡니다.
# 여기에 8080을 박으면 시스템 프로퍼티가 yaml을 이겨 라우팅 대상 포트와 어긋납니다.
#
# 메모리는 App Runner(2GB)와 값을 공유하지 않습니다. MaxRAMPercentage=70을 쓰면
# 힙 70% + 메타스페이스 + 다이렉트 + JVM 오버헤드가 Railway 컨테이너 한도를 넘겨
# 커널에 OOM-kill 당했습니다(로그 없이 Hibernate 초기화 직후 프로세스 소멸).
# 그래서 여기서는 비율이 아니라 고정 상한을 주고, 합이 한도 아래가 되도록 잡습니다.
#
# Railway 한도는 1GB다. 힙 외 영역까지 더한 최악값이 그 아래여야 한다:
#   힙 512 + 메타스페이스 192 + 다이렉트 64 + 스레드 스택(512k x 약 50) 25 + 코드캐시/GC 약 100
#   = 약 890MB — 130MB 남는다.
# MaxRAMPercentage=70은 힙 상한만 700MB라 나머지를 더하면 한도를 넘긴다. 그래서 비율을 쓰지 않는다.
# 한도를 올리면 -Xmx를 먼저 올리되, 위 합계가 한도의 90%를 넘지 않게 유지한다.
[deploy]
startCommand = "java -Xmx512m -XX:+UseSerialGC -Xss512k -XX:MaxMetaspaceSize=192m -XX:MaxDirectMemorySize=64m -XX:+ExitOnOutOfMemoryError -jar app.jar"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
