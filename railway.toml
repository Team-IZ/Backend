[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# startCommand를 생략하면 서비스에 저장된 옛 값(build/libs/backend-0.0.1-SNAPSHOT.jar)으로
# 폴백해 컨테이너가 즉시 죽습니다. Dockerfile ENTRYPOINT와 동일한 명령을 명시해 항상 덮어씁니다.
# 이미지 안에는 WORKDIR /app 기준 app.jar만 존재합니다.
[deploy]
startCommand = "java -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k -XX:MaxMetaspaceSize=192m -XX:MaxDirectMemorySize=64m -XX:+ExitOnOutOfMemoryError -Dserver.port=8080 -jar app.jar"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
