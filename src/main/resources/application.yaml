server:
  port: ${PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: backend

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: IzGetHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

springdoc:
  api-docs:
    path: /v3/api-docs

  packages-to-scan: com.bigproject.backend.domain
  paths-to-match: /api/v0/**

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    disable-swagger-default-url: true
    persist-authorization: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}

auth:
  login:
    allowed-origins: ${AUTH_LOGIN_ALLOWED_ORIGINS}
    super-admin-path: ${SUPER_ADMIN_LOGIN_PATH}
    manager-path: ${MANAGER_LOGIN_PATH}
    swagger-origin-override-enabled: ${AUTH_SWAGGER_ORIGIN_OVERRIDE_ENABLED}
    swagger-ui-origin: ${AUTH_SWAGGER_UI_ORIGIN}
  refresh-cookie:
    name: ${REFRESH_TOKEN_COOKIE_NAME}
    path: ${REFRESH_TOKEN_COOKIE_PATH}
    secure: ${REFRESH_TOKEN_COOKIE_SECURE}
    same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE}
