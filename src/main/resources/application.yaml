server:
  port: ${PORT:8080}
  # X-Forwarded-Proto를 읽어 https를 인식하게 한다(Swagger UI가 서버 URL을 요청에서 만든다).
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # 클라이언트 IP는 애플리케이션(ClientIpResolver)이 직접 뽑는다. 그래서 톰캣이
      # remoteAddr를 덮어쓰는 경로는 꺼 둔다 — 존재하지 않는 헤더를 가리키게 하는 방식이다.
      #
      # 왜 톰캣에 맡기지 않나: RemoteIpValve는 "직전 홉이 internal-proxies 정규식과 맞을 때만"
      # 동작한다. 그 기본 정규식은 사설 IPv4 대역만 담고 있어 Railway처럼 다른 대역을 쓰는
      # 환경에서는 조용히 아무것도 하지 않는다. 켜졌는지 꺼졌는지가 배포 환경에 따라 갈리는
      # 상태로 두면, 지금 고치는 종류의 버그가 "어디서는 되고 어디서는 안 되는" 모습으로 돌아온다.
      # 여기서 명시적으로 꺼 두면 어느 환경이든 클라이언트 IP를 뽑는 곳이 한 군데뿐이다.
      remote-ip-header: x-client-ip-handled-by-application
      protocol-header: x-forwarded-proto

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: backend

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: IzGetHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      data-source-properties:
        prepareThreshold: 0
        # pg_stat_activity에서 최신 백엔드와 구버전/다른 DB writer를 구분하기 위한 PGJDBC 식별자.
        # 배포 환경은 DB_APPLICATION_NAME을 revision별 값으로 주는 것이 가장 명확하다.
        ApplicationName: ${DB_APPLICATION_NAME:${spring.application.name:backend}-${PID:unknown}}

  servlet:
    multipart:
      # 컨트롤러에 닿기 전에 톰캣이 먼저 거절하는 상한이다. app.submission.max-zip-bytes 보다 넉넉해야
      # FILE_TOO_LARGE 에러 코드로 응답할 기회가 생긴다 — 여기서 걸리면 도메인 코드 없는 500이 나간다.
      max-file-size: ${SUBMISSION_MULTIPART_MAX_FILE_SIZE:60MB}
      max-request-size: ${SUBMISSION_MULTIPART_MAX_REQUEST_SIZE:60MB}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  web:
    error:
      include-stacktrace: never
      include-message: never
      include-binding-errors: never
      include-exception: false

web:
  client-ip:
    # 클라이언트 IP를 담아 오는 프록시 헤더.
    header: ${CLIENT_IP_HEADER:X-Forwarded-For}
    # 우리 앞에 있는 프록시(신뢰하는 홉)의 개수. Railway 하나만 앞에 있으면 1이다.
    #
    # X-Forwarded-For는 홉마다 자기가 본 상대의 주소를 뒤에 붙인다. 그래서 오른쪽에서
    # 이 개수만큼 센 자리가 "가장 바깥 프록시가 직접 관측한 주소" = 진짜 클라이언트다.
    # 왼쪽 끝을 쓰면 클라이언트가 적어 보낸 값을 그대로 믿게 되어 차단을 무한히 우회할 수 있고,
    # 남의 IP를 적어 그 사람을 막을 수도 있다.
    #
    # 앞단에 CDN을 추가하는 등 홉이 늘면 이 값도 함께 올려야 한다. 값이 실제보다 크면
    # 헤더가 모자라 프록시 주소로 떨어지고(차단이 다시 새기 시작한다), 작으면 프록시 자신의
    # 주소를 클라이언트로 읽는다. 배포 직후 "client-ip 첫 관측" 로그 한 줄로 확인할 수 있다.
    trusted-proxy-count: ${CLIENT_IP_TRUSTED_PROXY_COUNT:1}

# API 문서(Swagger UI · OpenAPI JSON)를 공개할지. 🔴 기본값은 true다.
#
# 왜 스위치를 두나: /swagger-ui.html 과 /v3/api-docs/** 는 인증 없이 열려 있어 누구나 전체 API
# 구조(엔드포인트·파라미터·에러 코드)를 읽을 수 있다. 공격 대상을 찾는 비용이 그만큼 줄어든다.
#
# 왜 기본을 켜 두나: 시연과 운영자 수동 조작이 Swagger 에 의존한다. 기본을 false 로 두면
# "어디선가 SWAGGER_ENABLED 를 안 넣어서 문서가 안 열리는" 사고가 배포마다 재발한다.
# 닫아야 하는 환경은 환경변수 한 줄(SWAGGER_ENABLED=false)로 끈다.
#
# 이 값 하나가 springdoc 의 두 스위치와 SecurityConfig 의 permitAll 목록을 함께 움직인다 —
# 셋이 따로 놀면 "문서는 꺼졌는데 경로는 여전히 인증 없이 열려 있는" 상태가 만들어진다.
swagger:
  enabled: ${SWAGGER_ENABLED:true}

springdoc:
  api-docs:
    enabled: ${swagger.enabled}
    path: /v3/api-docs

  packages-to-scan: com.bigproject.backend.domain
  paths-to-match: /api/v0/**

  swagger-ui:
    enabled: ${swagger.enabled}
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    disable-swagger-default-url: true
    persist-authorization: true

# AI(FastAPI) 연동. 서버가 둘이 아니라 딱 둘이다 -- 프록시(wake/sleep Lambda, 항상 이걸로
# 먼저/보통 부른다)와 origin(App Runner 컨테이너 원본, PAUSED를 못 깨우지만 Lambda Function
# URL의 6MB 동기 페이로드 상한이 없다 -- PDF·ZIP처럼 큰 본문은 여기로 직접 보낸다).
# 예전엔 이게 AI_BASE_URL/AI_CURRICULUM_BASE_URL/AI_CURRICULUM_ORIGIN_BASE_URL 셋으로
# 갈라져 있었는데(그중 둘은 완전히 같은 프록시를 가리키면서 이름만 달랐다), 2026-08-11
# 프록시 하나·origin 하나로 통합했다 -- 두 물리 서버에 env var도 정확히 둘.
ai:
  proxy-base-url: ${AI_PROXY_BASE_URL:http://localhost:8000}
  # App Runner 원본 도메인. 안 정하면 프록시와 같은 값으로 fallback(로컬 개발처럼
  # 프록시/원본 구분이 없는 환경 대응).
  origin-base-url: ${AI_ORIGIN_BASE_URL:${AI_PROXY_BASE_URL:http://localhost:8000}}
  proxy:
    # 원본으로 직접 보내기 전(교안 PDF·코드 제출) 프록시를 깨우는 GET /api/health의 상한.
    #
    # 🔴 짧게 잡으면 안 된다. 이 호출은 생존 확인이 아니라 기동 요청이고, 프록시가 원본이
    # RUNNING이 될 때까지 동기로 기다린다(유휴 후 첫 호출 ~80초 관측). 2초 같은 값을 쓰면
    # "잠들어 있는 정상 상태"가 전부 실패로 읽혀 AI가 멀쩡한데도 제출이 거부된다.
    warm-up-timeout: ${AI_PROXY_WARM_UP_TIMEOUT:PT150S}
  # AI의 require_internal_key가 읽는 공유 비밀(X-Internal-Key).
  # 비워 두면 헤더를 아예 붙이지 않는다 — AI 쪽도 "키 미설정 = 로컬 개발"로 검증을 건너뛴다.
  internal-key: ${AI_INTERNAL_KEY:}
  connect-timeout: ${AI_CONNECT_TIMEOUT:PT5S}
  # 🔴 짧게 잡으면 안 된다. AI는 LLM 호출 1회에 20초(SESSION_TIMEOUT_S)를 쓰고 최대 6회
  # (SESSION_MAX_ATTEMPTS) 재시도하므로 최악의 경우 2분 가까이 걸린다. 그 전에 끊으면
  # AI는 계속 작업 중인데 백엔드만 재시도해서 같은 요청에 LLM 비용이 두 번 나간다.
  read-timeout: ${AI_READ_TIMEOUT:PT150S}

  # AI와 주고받은 원문을 로그로 남긴다(AiPayloadLoggingInterceptor). 헤더는 찍지 않는다 —
  # X-Internal-Key 가 거기 실려 있다. 본문은 2000자에서 자르고 multipart(ZIP)는 크기만 찍는다.
  #
  # 켜 두는 이유: AiClient 는 응답을 곧바로 객체로 바꿔서, 202를 받았는데 jobId가 비는 경우에
  # "AI가 안 보냈다"와 "필드 이름이 달라 우리가 못 읽었다"를 구분할 근거가 남지 않는다.
  #
  # 대가로 응답 본문을 메모리에 버퍼링한다(인터셉터가 읽은 뒤 컨버터가 다시 읽어야 한다).
  # 분석 결과처럼 큰 응답이 부담되면 끈다.
  log-payloads: ${AI_LOG_PAYLOADS:true}

  # 코드 분석 연동. POST /analyses · GET /analyses/{jobId}.
  analysis:
    # 코드 분석에 쓸 모델의 ai_model.model_code.
    #
    # 🔴 비워 두거나 카탈로그에 없는 값을 넣으면 분석 요청 자체가 TEMPORARY_ERROR로 실패한다.
    # 일부러 그렇게 했다 — 모델을 지정하지 않으면 AI가 자기 기본 모델을 쓰는데, 그 modelCode가
    # 응답 aiUsage[]에 실려 오고 ai_usage.model_code는 ai_model을 참조하는 FK다. 카탈로그에
    # 없는 모델이면 사용량 행이 통째로 적재 실패하고, 그건 monthly_ai_budget 집행 근거가
    # 조용히 비는 것이라 분석 하나를 못 돌리는 것보다 나쁘다.
    #
    # 값 형식은 provider/provider_model_code다(2026-08-09 규칙). AI에 실제로 보내는 값은
    # 이 코드로 조회한 행의 provider_model_code이고, model_id는 analysis_job.requested_model_id에 남는다.
    model-code: ${AI_ANALYSIS_MODEL_CODE:nvidia/nemotron-3-ultra-550b-a55b}

    # 한 제출에 허용하는 총 분석 시도 횟수(첫 시도 포함, 재시도 횟수가 아니다).
    #
    # 다시 거는 대상은 일시적 실패 4종(TEMPORARY_ERROR·ANALYSIS_TIMEOUT·MODEL_ERROR·
    # SOURCE_UNREACHABLE)뿐이다. 저장소 URL 오류나 제출물 문제는 같은 제출을 다시 분석해도
    # 결과가 같아 재시도하지 않는다 — 그쪽 복구 경로는 교육생의 재제출이다.
    #
    # 상한이 없으면 AI 서버가 계속 죽어 있는 동안 안전망이 돌 때마다 전 제출을 다시 요청한다.
    # 분석 1회가 LLM 호출 20여 건이라 낭비가 크다. 1로 두면 재시도가 꺼진다.
    max-attempts: ${AI_ANALYSIS_MAX_ATTEMPTS:3}

    # 폴링에서 AI가 404("모르는 작업")를 줄 때 얼마나 기다려 주는가.
    #
    # 🔴 404를 받아도 external_job_id 는 절대 지우지 않는다. 종전에는 지웠는데, 그러면 폴링은
    # 그 job 을 건너뛰고(external_job_id IS NULL) 디스패치는 QUEUED/RUNNING 을 blocking job 으로
    # 보고 막아서 폴링도 재요청도 안 되는 영구 정체가 됐다.
    #
    # AI 앱이 명시한 JOB_NOT_FOUND를 처음 받은 시각부터 잰다. created_at/started_at 기준이 아니다.
    # 이 시간 또는 아래 연속 횟수 중 하나라도 먼저 도달하면 TEMPORARY_ERROR 로 닫아 안전망이
    # 새 execution_no 로 재요청한다(max-attempts 가 상한). 정상 응답이 오면 관측 기록을 초기화한다.
    # 관측 상태는 DB 스키마를 바꾸지 않고 프로세스 메모리에만 두므로 백엔드 재시작 시에도 초기화된다.
    #
    # 아주 크게 잡아도 아래 연속 횟수가 먼저 도달하면 종료된다.
    unknown-job-grace: ${AI_ANALYSIS_UNKNOWN_JOB_GRACE:PT10M}

    # AI 앱이 명시한 JOB_NOT_FOUND 연속 횟수 상한. 이 횟수 또는 위 유예시간 중 하나라도 먼저
    # 도달하면 job 유실로 확정한다. 프록시/라우터의 HTML·빈 본문 404는 이 횟수에 포함하지 않는다.
    unknown-job-max-consecutive: ${AI_ANALYSIS_UNKNOWN_JOB_MAX_CONSECUTIVE:3}

    # 활성 job을 폴링하는 최대 시간. 이 시간을 넘기면 원인과 무관하게 ANALYSIS_TIMEOUT 으로 닫는다.
    #
    # 🔴 위 두 값이 못 잡는 정체를 잡는 그물이다. JOB_NOT_FOUND 유예는 AI 가 그 코드를 말해 줄 때만
    # 동작하고 관측 상태도 프로세스 메모리라 재시작하면 초기화된다. 반면 프록시 404 지속, AI 5xx·
    # 타임아웃 반복, AI 가 영원히 RUNNING 만 응답하는 경우는 아무도 닫아 주지 않아 findByStatusIn 이
    # 그 행을 매 폴링마다 영원히 다시 고른다(BLOCKING_JOB_EXISTS 때문에 재요청도 막힌다).
    #
    # 기준은 analysis_job.created_at 이다. started_at 은 AI 가 준 값이라 우리 행보다 앞설 수 있고
    # QUEUED 에서는 NULL 이다. 분석 1건이 5분 안팎이라 기본값 30분은 정상 분석을 죽이지 않는다.
    stuck-job-timeout: ${AI_ANALYSIS_STUCK_JOB_TIMEOUT:PT30M}

    scheduler:
      # 기본 false. 켜져 있으면 앱을 띄우기만 해도 마감 지난 제출에 LLM 비용이 발생하고,
      # @SpringBootTest 컨텍스트가 뜰 때마다 실제 AI 서버로 요청이 나간다. 운영에서만 켠다.
      enabled: ${AI_ANALYSIS_SCHEDULER_ENABLED:false}
      # 요청 안전망. 정상 경로는 제출 이벤트가 즉시 처리하므로 여기서 걸리는 것이 없어야 정상이다.
      dispatch-delay: ${AI_ANALYSIS_DISPATCH_DELAY:PT5M}
      # 상태 폴링. 분석 1건이 5분 안팎 걸리지만, 교육생 화면이 "분석 중"에서 넘어가는 지연이
      # 곧 이 간격이라 짧게 잡았다.
      poll-delay: ${AI_ANALYSIS_POLL_DELAY:PT1M}
      # 기동 직후에는 돌지 않는다. 배포 롤링 중 두 인스턴스가 동시에 같은 제출을 집는 창을 줄인다
      # (uq_analysis_job_active가 최종 방어선이지만 예외 로그로 시끄러워진다).
      initial-delay: ${AI_ANALYSIS_SCHEDULER_INITIAL_DELAY:PT1M}

  report:
    # AI의 POST /reports는 202 + jobId만 주고 생성은 백그라운드에서 돈다.
    #
    # 🔴 아래 둘은 ReportGenerationServiceImpl(스레드를 붙들고 기다리는 동기 경로)만 쓴다.
    #    그 상한(2초 x 60회 = 2분)은 "AI 최악 20초 x 6회 재시도" 가정에서 나왔는데,
    #    2026-08-09 실측 응답이 latencyMs=129108(2분 9초)로 그 가정을 이미 넘겼다.
    #    즉 이 설정 그대로는 성공한 job을 타임아웃으로 처리한다.
    #    리포트 생성 배치(ReportBatchService)는 이 경로를 쓰지 않고 dispatch/poll 2단계로 돈다.
    #    동기 경로를 되살릴 일이 있으면 max-attempts부터 180(6분)으로 올려야 한다.
    poll-interval: ${AI_REPORT_POLL_INTERVAL:PT2S}
    poll-max-attempts: ${AI_REPORT_POLL_MAX_ATTEMPTS:60}

    # 리포트 생성에 쓸 모델의 ai_model.model_code.
    #
    # 🔴 코드 분석과 같은 이유로 비워 두면 안 된다. 지정하지 않으면 AI가 자기 기본 모델을 쓰고
    # 그 modelCode가 응답 aiUsage[]에 실려 오는데, ai_usage.model_code는 ai_model을 참조하는
    # FK다. 카탈로그에 없는 모델이면 사용량 행이 통째로 적재 실패하고, 그건 monthly_ai_budget
    # 집행 근거가 조용히 비는 것이라 리포트 하나를 못 만드는 것보다 나쁘다.
    #
    # 값 형식은 provider/provider_model_code다(2026-08-09 규칙).
    model-code: ${AI_REPORT_MODEL_CODE:minimaxai/minimax-m3}

    # 회차·교육생 1건에 허용하는 총 실행 횟수(첫 시도 포함, 재시도 횟수가 아니다).
    # 상한이 없으면 AI 서버가 계속 죽어 있는 동안 배치가 돌 때마다 전 대상을 다시 요청한다.
    # 리포트 1건이 문제 수(최대 3)만큼 LLM 호출이라 그 낭비가 작지 않다.
    max-attempts: ${AI_REPORT_MAX_ATTEMPTS:3}

    # 한 틱에 요청할 문제 수 상한.
    #
    # 없으면 조건에 맞는 것을 전부 순회한다. 반 전체가 비슷한 시각에 문제를 끝내면 한 틱에
    # 수십 건이 나가고, 순차 루프라 스케줄러 스레드가 그동안 묶인다. 상한이 있으면 밀린 것은
    # 다음 틱으로 넘어갈 뿐이라 잃는 것이 없다.
    #
    # 🔴 이것만으로는 과거 데이터 폭주를 막지 못한다 — 20건씩 1분마다면 9,795건이 8시간에 걸쳐
    # 결국 전부 나간다. 총량을 끊는 것은 아래 transition-cutoff-at 이다.
    dispatch-batch-size: ${AI_REPORT_DISPATCH_BATCH_SIZE:20}

    # 종료 표식이 빠진 문제를 안전망이 한 번에 몇 세션까지 메울지.
    #
    # LLM 호출이 없는 UPDATE라 디스패치 상한보다 크게 잡아도 된다. 상한을 두는 이유는 비용이
    # 아니라 한 트랜잭션이 잠그는 행 수다 — 한 세션이 문제 3개 x 축 4개라 200건이면 2,400행
    # 안팎이다. 정상 경로가 다 돌면 이 배치는 항상 0행이므로 값이 커도 부담이 없다.
    backfill-limit: ${AI_REPORT_BACKFILL_LIMIT:200}

    # 🔴 전환 컷오프. 이 시각 이전에 "시작된" 세션은 리포트 생성 대상이 아니다. 임시 조건이다.
    #
    # 회차 응시 창 폐기(28차 R1 §2)로 대상 판정이 개인 창으로 옮겨가면서, 회차 창이 자연히
    # 걸러 주던 옛 데이터가 전부 조건을 통과하게 됐다(실측 3,271세션 · LLM 호출 9,795건).
    # 개인 창은 그 세션이 열린 시각 기준이라 언제 응시했든 참이기 때문이다.
    #
    # 스케줄러를 꺼 두는 방안도 있었으나 택하지 않았다 — 그러면 전환 기간의 신규 응시도
    # 리포트를 못 받고, 미정리 세션 경고까지 함께 멈추며, 복귀를 사람의 기억에 맡기게 된다.
    # "조용히 0건"은 이 전환을 시작하게 만든 바로 그 실패 형태다(2026-08-16 합의 §2).
    #
    # 값은 이 조건을 넣은 시각이다. 그 이후 시작된 세션만 대상이 되므로 과거는 구조적으로
    # 빠지고 신규는 정상 동작한다. problem_stage.problem_closed_at 전환이 끝나면 dispatch
    # 조건에서 이 값을 지운다 — 그때는 옛 행이 그 컬럼 NULL 이라 같은 일을 한다.
    # 백필과 미정리 경고도 같은 상수를 쓰며, 그 둘은 영구히 남는다.
    transition-cutoff-at: ${AI_REPORT_TRANSITION_CUTOFF_AT:2026-08-16T05:45:00Z}

    # 문제 1건의 생성을 기다리는 상한. 실측 129초의 약 5배로 잡았다.
    # 없으면 AI가 잃어버린 job이 RUNNING으로 영원히 남고, 그 실행에 묶인 리포트가 확정되지
    # 않아 교육생 화면이 계속 `발행 전`이다.
    item-timeout: ${AI_REPORT_ITEM_TIMEOUT:PT10M}

    force-endpoint:
      # 🔴 기본 false. 켜면 POST /api/v0/reports/sessions/{sessionId}/generation 이 등록된다.
      #
      # 이 엔드포인트는 세션 유효성을 하나도 보지 않는다 — 세션·응시 완료, 종료 사유, 무효 확인,
      # 단계 정리, 발행 예정 시각을 전부 건너뛰고 세션 ID만 맞으면 AI를 부른다. 회차 마감을
      # 기다리거나 assessment_due_at 을 손대지 않고 8필드 조립과 AI 계약을 확인하려고 둔 경로다.
      #
      # 켜 두면 아무 세션에나 LLM 비용을 태울 수 있고 그 비용은 회수되지 않는다(무효 세션에도
      # 요청은 나가지만 결과는 발행되지 않는다). 연동 시험이 끝나면 다시 끈다.
      enabled: ${AI_REPORT_FORCE_ENDPOINT_ENABLED:false}

    scheduler:
      # 🔴 기본 false. 켜져 있으면 @SpringBootTest 컨텍스트가 뜰 때마다 실제 AI 서버로
      # 요청이 나가고, 로컬에서 앱을 띄워 둔 것만으로 종료된 회차에 LLM 비용이 발생한다.
      enabled: ${AI_REPORT_SCHEDULER_ENABLED:false}
      # 문제가 끝난 뒤 늦어도 이 간격 안에 요청이 나간다.
      #
      # [2026-08-11] 회차 마감 후 일괄에서 문제 단위 즉시 생성으로 바꾸면서 PT5M -> PT1M.
      # 학생이 다음 문제를 푸는 동안 앞 문제를 만들어 두는 것이 목적이라, 5분이면 문제 하나
      # 푸는 시간보다 길어 의미가 없다.
      #
      # 🔴 report_generation_run(report_id) 인덱스가 있어야 한다. 없으면 이 조회가 31초 걸려
      # (시드 기준 실측) 1분 주기를 감당하지 못한다. 인덱스가 있으면 527ms 다.
      dispatch-delay: ${AI_REPORT_SCHEDULER_DISPATCH_DELAY:PT1M}
      # 안전망. 종료 표식이 빠진 문제를 메우고(백필), 그래도 남은 세션을 세션 단위로 줍는다.
      #
      # [2026-08-16] PT10M -> P1D. 종전 10분은 대상 판정이 전체 훑기이던 시절의 값이다.
      # 지금은 종료가 problem_stage.problem_closed_at 에 이벤트로 기록되므로, 정상 경로가
      # 다 돌면 이 배치는 아무것도 하지 않는다 — 자주 돌면 백필 UPDATE 가 잠그는 행만 늘어난다.
      # 백필이 0이 아니면 그것 자체가 Assessment 종료 처리의 구멍을 뜻하는 신호다.
      sweep-delay: ${AI_REPORT_SCHEDULER_SWEEP_DELAY:P1D}
      # 발행 예정 시각 때문에 보류된 리포트를 발행하는 주기.
      # 시각 단위 판정이라 촘촘할 이유가 없다 — 예정 시각 후 최대 이 간격 안에 발행된다.
      publish-delay: ${AI_REPORT_SCHEDULER_PUBLISH_DELAY:PT5M}
      # 교육생 화면이 `발행 전`에서 넘어가는 지연이 곧 이 값이다.
      poll-delay: ${AI_REPORT_SCHEDULER_POLL_DELAY:PT1M}
      initial-delay: ${AI_REPORT_SCHEDULER_INITIAL_DELAY:PT1M}

  # 검증 세션 채점 연동. POST /sessions/{sessionId}/answers.
  session:
    # 답변 채점에 쓸 모델의 ai_model.model_code.
    #
    # 종전에는 이 키가 어디에도 없어 빈 값이 들어갔고, 그러면 요청 본문에서 필드가 통째로
    # 빠져 AI가 자기 기본 모델로 채점했다. 어떤 모델이 학생을 평가했는지가 우리 설정에
    # 드러나지 않는다는 뜻이고, 리포트 생성과 다른 모델이 채점하면 같은 회차 안에서
    # 판정 기준이 갈린다. 리포트와 같은 모델로 맞춘다.
    #
    # 🔴 다시 비우지 말 것. 코드 분석·리포트와 같은 이유다 — 미지정이면 AI가 쓴 modelCode가
    # 응답 aiUsage[]에 실려 오는데 ai_usage.model_code는 ai_model을 참조하는 FK라,
    # 카탈로그에 없는 모델이면 사용량 행이 통째로 적재 실패한다. 세션 채점은 아직 그 원장
    # 적재가 없어 지금은 드러나지 않지만, 적재를 붙이는 순간 같은 문제를 그대로 만난다.
    #
    # 키 이름이 provider-model-code지만 값은 다른 두 경로와 같은 model_code 전체 코드다
    # (provider/provider_model_code, 2026-08-09 규칙).
    provider-model-code: ${AI_SESSION_MODEL_CODE:minimaxai/minimax-m3}

  # 교안 분석 연동. develop 머지 때 파일 아래쪽에 `ai:` 블록이 하나 더 생겨
  # YAML 중복 키로 기동이 통째로 실패했다(snakeyaml: found duplicate key ai).
  # 값과 환경변수 이름은 그대로 두고 이 블록 안으로 옮기기만 했다.
  #
  # [2026-08-10] 공통 설정과 어긋나던 둘을 맞췄다. 종전에는 AI_CURRICULUM_BASE_URL ·
  # AI_INTERNAL_API_KEY 라는 이름을 따로 썼는데, 같은 AI 서버의 같은 공유 비밀을 가리키면서
  # 환경변수만 둘이라 한쪽만 채워 넣는 사고가 나기 쉬웠다.
  #
  # [2026-08-11] base-url 을 여기서 없앴다. 교안 제출은 원본 서버로 나가므로
  # AiCurriculumClient 가 위쪽 ai.origin-base-url 을 직접 읽는다. 남은 x-internal-key 는
  # 위 ai.internal-key 와 같은 값을 가리키는 중복이라 정리 후보다.
  curriculum:
    x-internal-key: ${AI_INTERNAL_KEY:}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}

auth:
  login:
    # 로그인·재발급·로그아웃에서 서버가 직접 검사하는 Origin 허용 목록. CORS 설정도 같은 값을 쓴다.
    # 목록에 없으면 브라우저가 아니라 서버가 403 LOGIN_ORIGIN_NOT_ALLOWED로 거절하므로,
    # 배포 도메인이 빠지면 로그인 자체가 되지 않는다.
    #
    # 로컬 오리진을 여러 개 여는 것은 위험하지 않다 — http://localhost:*는 그 사람의 자기 컴퓨터에서
    # 띄운 것만 해당하고, 공격자가 그 오리진을 쓸 수 있는 시점이면 이미 피해자 PC에서 코드를 돌리는
    # 중이라 CORS가 막을 수 있는 것이 없다. 5173 하나만 열어 두면 Vite가 포트를 말없이 밀거나
    # (5174·5175) 127.0.0.1로 열거나 vite preview(4173)를 쓸 때마다 "로그인이 갑자기 안 된다"가 된다.
    allowed-origins: ${AUTH_LOGIN_ALLOWED_ORIGINS:https://frontend-eight-neon-73.vercel.app,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://localhost:4173}
    # 호스트에 * 와일드카드를 쓴 항목(예: https://*.vercel.app)을 허용할지. Vercel 프리뷰 배포는 PR마다
    # URL이 바뀌어 고정 등록이 안 되므로 그때 켠다. 기본은 꺼 둔다 — *.vercel.app은 남의 프로젝트까지
    # 포함하는 범위라 상시로 열어 둘 값이 아니다.
    allow-origin-wildcards: ${AUTH_LOGIN_ALLOW_ORIGIN_WILDCARDS:false}
    swagger-origin-override-enabled: ${AUTH_SWAGGER_ORIGIN_OVERRIDE_ENABLED}
    swagger-ui-origin: ${AUTH_SWAGGER_UI_ORIGIN}
    # 연속 실패 차단(A1). 기준 잠금이 지날 때마다 다음 잠금이 2배로 늘고 상한에서 멈춘다.
    # 성공하면 카운터를 버린다. 임계값이 낮거나 지속이 길면 그 자체가 남을 막는 공격 수단이 되므로
    # 5회·60초로 잡았다 — 오타 반복은 넘기고 자동화만 실질적으로 막는 선이다.
    throttle:
      max-attempts: ${AUTH_LOGIN_THROTTLE_MAX_ATTEMPTS:5}
      initial-block: ${AUTH_LOGIN_THROTTLE_INITIAL_BLOCK:PT1M}
      max-block: ${AUTH_LOGIN_THROTTLE_MAX_BLOCK:PT15M}
  password:
    # 비밀번호 유효기간(일). 🔴 기본값 0은 비활성이며, 0이면 만료 판정을 아예 하지 않는다.
    #
    # 변경 주기는 기술이 아니라 운영이 정하는 값이다(주기·예외 대상·안내 방법). 정해지기 전에
    # 임의의 기본값을 켜 두면 어느 날 갑자기 계정이 잠기고, 그게 시연 당일이면 되돌릴 방법이 없다.
    # 그래서 구조만 넣고 스위치는 꺼 둔다 — 정책이 확정되면 이 환경변수 하나로 켜진다.
    #
    # 켜면 로그인·재발급에서 app_user.password_changed_at 이 이 일수를 넘긴 계정을
    # 403 PASSWORD_EXPIRED 로 거절한다. 화면은 그 코드에서 비밀번호 재설정으로 보낸다
    # (정지·일시 차단과 달리 사용자가 지금 스스로 풀 수 있는 상태다).
    max-age-days: ${AUTH_PASSWORD_MAX_AGE_DAYS:0}
  refresh-cookie:
    name: ${REFRESH_TOKEN_COOKIE_NAME:refresh_token}
    path: ${REFRESH_TOKEN_COOKIE_PATH:/api/v0/auth}
    # SameSite=None에는 Secure가 필수다(브라우저가 Secure 없는 None 쿠키를 조용히 버린다).
    # Lax로 두면 다른 사이트에서 보내는 fetch/XHR에 쿠키가 실리지 않아 재발급이 전면 불가해진다 —
    # 프론트(Vercel·localhost)와 백엔드(railway.app)는 서로 다른 사이트다.
    secure: ${REFRESH_TOKEN_COOKIE_SECURE:true}
    same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE:None}

invitation:
  base-url: ${INVITATION_BASE_URL}
  expiration: ${INVITATION_EXPIRATION}
  mail:
    host: ${INVITATION_MAIL_HOST:}
    port: ${INVITATION_MAIL_PORT:587}
    username: ${INVITATION_MAIL_USERNAME:}
    password: ${INVITATION_MAIL_PASSWORD:}
    from: ${INVITATION_MAIL_FROM:}
    starttls-enabled: ${INVITATION_MAIL_STARTTLS_ENABLED:true}
    time-zone: ${INVITATION_MAIL_TIME_ZONE:Asia/Seoul}
    # 연결 하나로 보낼 최대 건수이자, 보내고 곧바로 원장에 기록하는 단위다.
    # 제공자마다 세션당 발송 상한이 있어(Gmail 계열은 통상 100건 안팎) 통째로 보내지 않고 끊는다.
    # 크게 잡으면 왕복이 줄지만 그만큼 진행률 폴링이 늦게 움직인다.
    batch-size: ${INVITATION_MAIL_BATCH_SIZE:100}
    outbox:
      # 🔴 발송이 멈춘 초대를 이어받는 안전망. 기본은 꺼 둔다 —
      # 켜면 컨텍스트가 뜨는 것만으로 실제 초대 메일이 나갈 수 있어 로컬·테스트에서 위험하다.
      #
      # 운영에서는 켜야 한다. 꺼 두면 배포·크래시로 발송이 끊긴 초대가 PENDING에 남아
      # 아무도 이어받지 않고, 명단 화면의 [초대 재발송]으로만 복구된다.
      enabled: ${INVITATION_MAIL_OUTBOX_ENABLED:false}
      # 이 시간이 지나도 PENDING인 클레임을 "멈춘 것"으로 본다.
      # 정상 발송이 끝나는 시간(900명 기준 약 3분)보다 넉넉해야 한다 — 짧으면 아직 보내는 중인
      # 초대를 다른 인스턴스가 집어 교육생이 메일을 두 통 받는다.
      stall-threshold: ${INVITATION_MAIL_OUTBOX_STALL_THRESHOLD:PT10M}
      claim-limit: ${INVITATION_MAIL_OUTBOX_CLAIM_LIMIT:200}
      delay: ${INVITATION_MAIL_OUTBOX_DELAY:PT2M}
      initial-delay: ${INVITATION_MAIL_OUTBOX_INITIAL_DELAY:PT1M}
  # 자리 확보를 몇 건씩 한 트랜잭션으로 묶을지. 이 값이 곧 "경합이 나면 행 단위로 되돌릴 범위"다.
  reservation-chunk-size: ${INVITATION_RESERVATION_CHUNK_SIZE:100}

curriculum:
  upload:
    # 교안 PDF 파일당 상한.
    #
    # 🔴 spring.servlet.multipart.max-file-size(60MB)보다 작아야 한다. 톰캣에서 먼저 걸린 요청은
    # 컨트롤러에 닿지 못해 도메인 코드 없는 500 이 나가고, 화면은 왜 거부됐는지 말할 근거가 없다.
    # 앱이 먼저 판정하면 413 CURRICULUM_FILE_TOO_LARGE 로 나가 상한을 안내할 수 있다.
    # 제출물 ZIP(app.submission.max-zip-bytes)과 같은 이중 상한 구조다.
    max-bytes: ${CURRICULUM_UPLOAD_MAX_BYTES:52428800}

password-reset:
  base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:5173}
  expiration: ${PASSWORD_RESET_EXPIRATION:PT30M}
  request-cooldown: ${PASSWORD_RESET_REQUEST_COOLDOWN:PT1M}

app:
  report:
    # 리포트를 발행하면서 교육생 공개까지 자동으로 할지.
    #
    # 🔴 기본은 꺼 둔다(actor-user-id 가 비면 동작하지 않는다). 켜면 매니저의 판단 없이 리포트가
    # 학생에게 나가고, AI가 일부 실패한 PARTIAL 리포트(개념 카드가 빠진 것)도 그대로 나간다.
    # 켤지는 운영이 정할 일이라 기본값으로 정하지 않는다.
    #
    # actor-user-id 가 필요한 이유: ck_report_trainee_release_status_2 가 RELEASED 에
    # trainee_released_by NOT NULL 을 요구하고 그 컬럼이 app_user FK 다. 배치에는 "누가
    # 공개했는가"에 넣을 사용자가 없어서 밖에서 받아야 한다.
    #
    # 운영에서는 자동화 전용 시스템 계정을 가리켜야 한다 — 사람 계정을 넣으면 감사 기록이
    # 그 사람을 지목한다. 로컬 확인용으로는 아무 계정 UUID 나 넣어도 동작한다.
    auto-release:
      actor-user-id: ${REPORT_AUTO_RELEASE_ACTOR:}
      # SUMMARY 는 문답 원문을 닫는다. PRIVATE 은 Report.release 가 거부한다(비공개는 withhold).
      scope: ${REPORT_AUTO_RELEASE_SCOPE:FULL}

  submission:
    # ZIP 제출물 저장 위치. 지금은 로컬 파일시스템이며 경로는 <root>/<orgId>/<teamId>/<submissionId>.zip 이다.
    # 인스턴스가 여러 대가 되거나 분석 배치가 별도 프로세스로 분리되면 이 경로로는 파일을 찾을 수 없으므로
    # SubmissionArtifactStorage 의 S3 구현체로 교체해야 한다.
    storage-root: ${SUBMISSION_STORAGE_ROOT:./var/submissions}
    # 파일당 상한. 정의서에 원천 컬럼이 없어 애플리케이션 상수로 두고 적용값을
    # submission_artifact.applied_max_file_bytes 에 그대로 기록한다. 정책화가 필요해지면
    # organization_policy.max_submission_file_bytes 로 승격한다.
    max-zip-bytes: ${SUBMISSION_MAX_ZIP_BYTES:52428800}
