server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  error:
    # 오류 응답에 내부 정보를 싣지 않는다. 켜 두면 스택트레이스·실행 SQL·실패한 DB 행이 그대로 나가는데,
    # 실제로 초대 취소 실패 500 응답에 사용자 이메일과 초대 토큰 해시까지 노출된 적이 있다.
    # 원인은 서버 로그로 확인한다.
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: backend

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: IzGetHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      data-source-properties:
        prepareThreshold: 0

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

springdoc:
  api-docs:
    path: /v3/api-docs

  packages-to-scan: com.bigproject.backend.domain
  paths-to-match: /api/v0/**

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    disable-swagger-default-url: true
    persist-authorization: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}

auth:
  login:
    allowed-origins: ${AUTH_LOGIN_ALLOWED_ORIGINS}
    swagger-origin-override-enabled: ${AUTH_SWAGGER_ORIGIN_OVERRIDE_ENABLED}
    swagger-ui-origin: ${AUTH_SWAGGER_UI_ORIGIN}
  refresh-cookie:
    name: ${REFRESH_TOKEN_COOKIE_NAME}
    path: ${REFRESH_TOKEN_COOKIE_PATH}
    secure: ${REFRESH_TOKEN_COOKIE_SECURE}
    same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE}

invitation:
  base-url: ${INVITATION_BASE_URL}
  expiration: ${INVITATION_EXPIRATION}
  mail:
    host: ${INVITATION_MAIL_HOST:}
    port: ${INVITATION_MAIL_PORT:587}
    username: ${INVITATION_MAIL_USERNAME:}
    password: ${INVITATION_MAIL_PASSWORD:}
    from: ${INVITATION_MAIL_FROM:}
    starttls-enabled: ${INVITATION_MAIL_STARTTLS_ENABLED:true}
    time-zone: ${INVITATION_MAIL_TIME_ZONE:Asia/Seoul}

password-reset:
  base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:5173}
  expiration: ${PASSWORD_RESET_EXPIRATION:PT30M}
  request-cooldown: ${PASSWORD_RESET_REQUEST_COOLDOWN:PT1M}
