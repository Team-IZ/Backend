name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

# 같은 브랜치에 새 커밋이 올라오면 이전 실행을 취소해 러너 시간을 아낍니다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # CI에는 .env 파일이 없으므로 application.yaml이 요구하는 값을 더미로 채웁니다.
    # 실제 비밀값이 아니며, 테스트는 H2를 사용하므로 DB에 접속하지 않습니다.
    env:
      DB_URL: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
      DB_USERNAME: sa
      DB_PASSWORD: ""
      JWT_SECRET: ci-dummy-secret-key-for-tests-only-do-not-use-in-production
      JWT_ACCESS_TOKEN_EXPIRATION: 1800000
      JWT_REFRESH_TOKEN_EXPIRATION: 1209600000
      AUTH_LOGIN_ALLOWED_ORIGINS: http://localhost:3000
      SUPER_ADMIN_LOGIN_PATH: /api/v0/auth/super-admin/login
      MANAGER_LOGIN_PATH: /api/v0/auth/manager/login
      AUTH_SWAGGER_ORIGIN_OVERRIDE_ENABLED: "false"
      AUTH_SWAGGER_UI_ORIGIN: http://localhost:8080
      REFRESH_TOKEN_COOKIE_NAME: refreshToken
      REFRESH_TOKEN_COOKIE_PATH: /
      REFRESH_TOKEN_COOKIE_SECURE: "false"
      REFRESH_TOKEN_COOKIE_SAME_SITE: Lax
      INVITATION_BASE_URL: http://localhost:3000
      MANAGER_INVITATION_PATH: /invite/manager
      TRAINEE_INVITATION_PATH: /invite/trainee
      INVITATION_EXPIRATION: 604800000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --no-daemon --console=plain

      # 실패했을 때 어느 테스트가 왜 깨졌는지 리포트를 받아볼 수 있게 합니다.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
