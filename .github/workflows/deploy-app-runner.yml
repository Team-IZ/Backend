name: Deploy to App Runner

on:
  push:
    branches: [develop]

# 배포 도중 새 push가 들어와도 진행 중인 배포는 끝까지 — 취소하면 ECR에 반쪽 이미지가 남을 수 있다.
concurrency:
  group: deploy-app-runner
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # CI에는 .env가 없으므로 application.yaml이 요구하는 값을 더미로 채운다.
    # 실제 비밀값이 아니며, 테스트는 H2를 쓰므로 실제 DB에 접속하지 않는다.
    env:
      DB_URL: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
      DB_USERNAME: sa
      DB_PASSWORD: ""
      JWT_SECRET: ci-dummy-secret-key-for-tests-only-do-not-use-in-production
      JWT_ACCESS_TOKEN_EXPIRATION: "1800000"
      JWT_REFRESH_TOKEN_EXPIRATION: "1209600000"
      AUTH_LOGIN_ALLOWED_ORIGINS: http://localhost:5173
      AUTH_SWAGGER_ORIGIN_OVERRIDE_ENABLED: "false"
      AUTH_SWAGGER_UI_ORIGIN: http://localhost:8080
      REFRESH_TOKEN_COOKIE_NAME: refresh_token
      REFRESH_TOKEN_COOKIE_PATH: /
      REFRESH_TOKEN_COOKIE_SECURE: "false"
      REFRESH_TOKEN_COOKIE_SAME_SITE: Lax
      INVITATION_BASE_URL: http://localhost:5173
      INVITATION_EXPIRATION: PT24H
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --no-daemon --console=plain

  deploy:
    name: Build & push to ECR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 장기 자격증명(액세스키)을 저장하지 않고 OIDC로 짧은 수명 토큰만 발급받는다.
      # 이 역할은 repo:Team-IZ/Backend:ref:refs/heads/develop 에서만 assume 가능하도록
      # 신뢰정책에 스코프가 걸려 있다.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::357457230521:role/github-actions-teamiz-backend-deploy
          aws-region: ap-northeast-1

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # App Runner의 컨테이너 이미지 배포는 amd64만 지원한다(아키텍처 선택 옵션이 API에 없음).
      # GitHub 러너는 기본이 amd64라 --platform 없이도 맞지만, 명시해서 사고를 원천 차단한다.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/teamiz-backend:latest

      # D1: 배포를 App Runner의 AutoDeploymentsEnabled(암묵적 EventBridge 트리거)에 맡기지 않고
      # 이 워크플로가 직접 확정짓는다.
      #   WHY: App Runner는 서비스가 PAUSED인 동안 들어온 새 이미지를 resume 시점에도 자동배포
      #        안 함(AWS 공식 문서, 2026-08-08 실제 재현 -- 9차 API 반영 PR이 새벽에 병합됐는데
      #        서비스가 idle-pause 중이라 배포가 약 10시간 조용히 누락됨. CI는 계속 success였음).
      #        서비스는 request-based idle-pause를 쓰므로(20분 무요청 시 자동정지) 이 갭이
      #        상시 재현 가능한 조건임 -- 한 번의 우연이 아니라 구조적 문제.
      #   COST: GitHub Actions 역할에 apprunner:ResumeService/StartDeployment/ListOperations
      #        권한 추가 필요(ECR push 권한만 있던 것에서 확장). 배포마다 폴링으로 CI 시간이
      #        조금 늘어남(수십 초~수 분, resume 필요 시 최대 1분 내외 추가).
      #   EXIT: 서비스에서 pause 자동화를 완전히 없애면(24/7 상시로 전환) 이 스텝 없이 순수
      #        AutoDeploymentsEnabled만으로 되돌려도 안전함 -- 그 경우에도 이 스텝은 그냥
      #        중복 확인일 뿐 해가 되지 않으므로 지우지 않아도 됨.
      - name: Deploy to App Runner
        env:
          SERVICE_ARN: arn:aws:apprunner:ap-northeast-1:357457230521:service/teamiz-backend/366dffb648d0441cb4112b7ec49c1c54
        run: |
          set -euo pipefail

          STATUS=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query 'Service.Status' --output text)
          echo "Current service status: $STATUS"

          if [ "$STATUS" = "PAUSED" ]; then
            echo "Service is paused, resuming..."
            aws apprunner resume-service --service-arn "$SERVICE_ARN" >/dev/null
          fi

          for i in $(seq 1 40); do
            STATUS=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query 'Service.Status' --output text)
            [ "$STATUS" = "RUNNING" ] && break
            sleep 8
          done
          if [ "$STATUS" != "RUNNING" ]; then
            echo "Service did not reach RUNNING in time (status: $STATUS)"
            exit 1
          fi

          OP_ID=$(aws apprunner start-deployment --service-arn "$SERVICE_ARN" --query 'OperationId' --output text)
          echo "Started deployment operation: $OP_ID"

          for i in $(seq 1 60); do
            OP_STATUS=$(aws apprunner list-operations --service-arn "$SERVICE_ARN" --max-results 5 \
              --query "OperationSummaryList[?Id=='$OP_ID'].Status" --output text)
            case "$OP_STATUS" in
              SUCCEEDED)
                echo "Deployment succeeded."
                exit 0
                ;;
              FAILED|ROLLBACK_FAILED|ROLLBACK_SUCCEEDED)
                echo "Deployment did not succeed (status: $OP_STATUS) -- check CloudWatch logs."
                exit 1
                ;;
            esac
            sleep 8
          done
          echo "Timed out waiting for deployment $OP_ID to finish"
          exit 1
